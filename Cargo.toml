[package]
name = "nam-rs"
version = "2.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/fabiohl/nam-rs"
description = "Neural Amp Modeler (NAM) client in Rust"
authors = ["Fábio Henrique de Lima Silva <fabio.henrique.lima.silva@gmail.com>"]
keywords = ["audio", "dsp", "neural", "amp", "modeler"]
categories = [
    "multimedia::audio",
    "multimedia::audio::analysis",
    "multimedia::audio::effects",
]

[dependencies]
anyhow = "1.0.102"
thiserror = "2.0"
libc = "0.2.186"
pipewire = { version = "0.10.0", optional = true }
rtrb = "0.3.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
lexopt = "0.3.2"
log = "0.4.32"
env_logger = { version = "0.11.10", default-features = false }
half = "2.7.1"
minstant = "0.1.7"
rustfft = { version = "6.4.1", default-features = false }
clack-common = { version = "0.1", optional = true }
clack-plugin = { version = "0.1", optional = true }
clack-extensions = { version = "0.1", optional = true, features = ["audio-ports", "clack-plugin", "gui", "latency", "log", "params", "state", "raw-window-handle_05", "track-info", "remote-controls", "param-indication", "clack-host", "preset-discovery", "render", "state-context"] }
egui      = { version = "0.34.3",  optional = true }
egui_glow = { version = "0.34.3",  optional = true }
glow      = { version = "0.17.0",  optional = true }
baseview  = { version = "0.1.2", optional = true }
rfd       = { version = "0.17.2",  optional = true }
keyboard-types = { version = "0.6", default-features = false, optional = true }

[dev-dependencies]
clack-host = { version = "0.1", features = ["clack-plugin"] }
clap-sys = "0.5"
criterion = { version = "0.8.2", default-features = false }
proptest = "1.11.0"

[[bench]]
name = "inference_bench"
harness = false

[[bench]]
name = "dot_4x_bench"
harness = false

[features]
default = ["standalone", "testing"]
standalone = ["dep:pipewire", "stereo"]
clap-plugin = ["dep:clack-plugin", "dep:clack-extensions", "dep:clack-common", "dep:egui", "dep:egui_glow", "dep:baseview", "baseview/opengl", "dep:rfd", "dep:glow", "dep:keyboard-types"]
stereo = []
testing = []
heap-audit = []
long_bench = []
pgo = []

[[bin]]
name = "nam-rs"
path = "src/main.rs"
required-features = ["standalone"]

[[bin]]
name = "gen_stress"
path = "src/bin/gen_stress.rs"
required-features = ["testing"]

[[bin]]
name = "wav_to_golden"
path = "src/bin/wav_to_golden.rs"
required-features = ["testing"]

[lib]
name = "nam_rs"
crate-type = ["rlib", "cdylib"]

[profile.release]
strip = true      # Remove symbols (smaller binary)
lto = "fat"       # Link Time Optimization (slower build, better runtime)
opt-level = 3     # Maximum optimization level
codegen-units = 1 # Reduce parallel codegen (slower build, better optimization)
panic = "unwind"  # Use unwind to maintain compatibility with bench/test harnesses

[profile.dev]
debug = 1                    # Line tables only (faster than full debug info)
opt-level = 0                # No optimizations for max build speed
incremental = true           # Incremental compilation (faster build)
split-debuginfo = "unpacked" # Faster linking on Linux
