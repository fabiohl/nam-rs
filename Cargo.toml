[package]
name = "nam-rs"
version = "1.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
libc = "0.2.186"
pipewire = "0.9.2"
rtrb = "0.3.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
lexopt = "0.3.2"
# rubato 0.16.x: Fixado em 0.16 (não 2.0) — a API 2.0 introduziu dependência obrigatória de
# audioadapter/audioadapter-buffers, que aumenta a superfície de dependência sem benefício
# concreto para o nosso modelo RT-safe. O 0.16.x expõe SincFixedIn<f32> com Vec<Vec<f32>>
# pré-alocados, compatível com zero-alloc na thread DSP (process_into_buffer é RT-safe).
# fft_resampler desabilitado: remove dependência RustFFT (não usamos resampler síncrono FFT).
rubato = { version = "0.16", default-features = false }
log = "0.4.29"
env_logger = { version = "0.11.10", default-features = false }
half = "2.7.1"
minstant = "0.1.7"

[profile.release]
strip = true      # Remove symbols (smaller binary)
lto = "fat"       # Link Time Optimization (slower build, better runtime)
opt-level = 3     # Maximum optimization level
codegen-units = 1 # Reduce parallel codegen (slower build, better optimization)
panic = "abort"   # Abort on panic (smaller binary, no stack unwind)

[profile.dev]
debug = 1                    # Line tables only (faster than full debug info)
opt-level = 0                # No optimizations for max build speed
incremental = true           # Incremental compilation (faster build)
split-debuginfo = "unpacked" # Faster linking on Linux

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
proptest = "1.11.0"

[[bench]]
name = "inference_bench"
harness = false
