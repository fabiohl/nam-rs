[package]
name = "nam-rs"
version = "3.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/fabiohl/nam-rs"
description = "Neural Amp Modeler (NAM) client in Rust"
authors = ["Fábio Henrique de Lima Silva <fabio.henrique.lima.silva@gmail.com>"]
keywords = ["audio", "dsp", "neural", "amp", "modeler"]
categories = [
    "multimedia::audio",
    "multimedia::audio::analysis",
    "multimedia::audio::effects",
]

[dependencies]
# Lean error signaling for prep/CLI threads; not used on the RT thread.
anyhow = "1.0.103"
# Typed errors for the NAMB/loader surface (`src/loader/namb/error.rs`) and CLAP state extensions.
thiserror = "2.0"
# POSIX calls with no safe wrapper needed: SCHED_FIFO, core affinity, mlockall, prctl (THP), sigaction.
libc = "0.2.186"
# Native Linux audio backend (libpipewire 0.3 bindings). Conditional on `standalone`; absent from clap-plugin builds.
pipewire = { version = "0.10.0", optional = true }
# Lock-free SPSC ring buffer for CLI/GUI -> DSP thread communication (params, models, resamplers).
rtrb = "0.3.4"
# `.nam` (JSON) model deserialization.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Minimalist, zero-alloc CLI parser for `--model`/`--input-gain`/etc. (avoids `clap`'s binary-size cost).
lexopt = "0.3.2"
# Logging facade (`log::info!`/`warn!`/`error!`), zero overhead when disabled.
log = "0.4.33"
# `RUST_LOG`-configurable logging backend; `default-features = false` to skip regex/native color deps.
env_logger = { version = "0.11.11", default-features = false }
# CLAP plugin framework (typed, no runtime overhead over clap-sys). Chosen over nih-plug: no forced VST3/GUI.
clack-common = { version = "0.1", optional = true }
clack-plugin = { version = "0.1", optional = true }
clack-extensions = { version = "0.1", optional = true, features = ["audio-ports", "audio-ports-activation", "clack-plugin", "gui", "latency", "log", "params", "state", "raw-window-handle_05", "thread-check", "track-info", "remote-controls", "param-indication", "clack-host", "preset-discovery", "render", "state-context", "tail"] }
# Immediate-mode GUI (egui) + OpenGL renderer (egui_glow/glow) for the CLAP plugin interface.
egui      = { version = "0.34.3",  optional = true }
egui_glow = { version = "0.34.3",  optional = true }
glow      = { version = "0.17.0",  optional = true }
# Native embedded window (X11) hosting the egui GUI inside the DAW.
baseview  = { version = "0.1.4", optional = true }
# Native async file dialog for loading .nam/.namb/.wav from the GUI; never blocks the UI thread.
rfd       = { version = "0.17.2",  optional = true }
# Keyboard event types shared between baseview and egui for GUI accessibility (Tab/Shift+Tab focus).
keyboard-types = { version = "0.6", default-features = false, optional = true }
# clack-host is only needed here to satisfy state (de)serialization round-trip types shared with the plugin.
clack-host = { version = "0.1", features = ["clack-plugin"], optional = true }

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# CLAP host harness for integration tests (lifecycle, state migration, multi-instance).
clack-host = { version = "0.1", features = ["clack-plugin"] }
clap-sys = "0.5"
# Statistical benchmarking; `html_reports` left disabled to keep iterative bench compile times low.
criterion = { version = "0.8.2", default-features = false }
# Property-based testing for FastMath kernels (`simd_tanh`/`simd_sigmoid`) and parser fuzzing.
proptest = "1.11.0"
# Model-checking tool for concurrency protocols
loom = "0.7"

[[bench]]
name = "inference_bench"
harness = false

[[bench]]
name = "long_inference_bench"
harness = false

[[bench]]
name = "dsp_bench"
harness = false

[[bench]]
name = "dot_4x_bench"
harness = false

[[bench]]
name = "kahan_conv1d_bench"
harness = false

[[bench]]
name = "fft_radix4_bench"
harness = false

[[bench]]
name = "math_bench"
harness = false

[[bench]]
name = "gemv_bench"
harness = false

[[bench]]
name = "linear"
harness = false

[[bench]]
name = "regression_gate"
harness = false

[[bench]]
name = "cabsim_bench"
harness = false

[[bench]]
name = "clap_bench"
harness = false

[[bench]]
name = "head_gemv_bench"
harness = false

[features]
default = ["standalone"]
standalone = ["dep:pipewire", "stereo"]
clap-plugin = ["dep:clack-plugin", "dep:clack-extensions", "dep:clack-common", "dep:egui", "dep:egui_glow", "dep:baseview", "baseview/opengl", "dep:rfd", "dep:glow", "dep:keyboard-types", "dep:clack-host"]
stereo = []
testing = []
heap-audit = []
long_bench = []                                       # → benches/long_inference_bench.rs, utils/tests-long.sh
# Feature tag used by utils/build-release.sh to switch compiler flags
# for Profile-Guided Optimization builds. The feature is empty (no #[cfg]
# gates depend on it) — the build script reads it to set RUSTFLAGS.
pgo = []                                              # → utils/build-release.sh (PGO build profile)
dynamic-engine = []                                    # → A2 dynamic engine scaffolding (T3.1/T3.2)

[[bin]]
name = "nam-rs"
path = "src/main.rs"
required-features = ["standalone"]

[[bin]]
name = "gen_stress"
path = "src/bin/gen_stress.rs"
required-features = ["testing"]

[[bin]]
name = "wav_to_golden"
path = "src/bin/wav_to_golden.rs"
required-features = ["testing"]

[[bin]]
name = "pgo_profiling_workload"
path = "src/bin/pgo_profiling_workload.rs"
required-features = ["clap-plugin", "testing"]

[lib]
name = "nam_rs"
crate-type = ["rlib", "cdylib"]

[profile.release]
strip = true      # Remove symbols (smaller binary)
lto = "fat"       # Link Time Optimization (slower build, better runtime)
opt-level = 3     # Maximum optimization level
codegen-units = 1 # Reduce parallel codegen (slower build, better optimization)
panic = "unwind"  # Use unwind to maintain compatibility with bench/test harnesses

[profile.dist]
inherits = "release"
panic = "abort"

[profile.dev]
debug = 1                    # Line tables only (faster than full debug info)
opt-level = 0                # No optimizations for max build speed
incremental = true           # Incremental compilation (faster build)
split-debuginfo = "unpacked" # Faster linking on Linux

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[lints.clippy]
allow_attributes = "warn"
